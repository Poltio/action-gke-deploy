name: GKE Deploy via Artifact Registry
description: Deploys containers to GKE via Google Artifact Registry
inputs:
  GOOGLE_CLOUD_PROJECT_ID:
    description: Google Cloud Project ID you want to use.
    required: true
  GOOGLE_CLOUD_SERVICE_ACCOUNT_KEY:
    description: Google Cloud Service Account KEY
    required: true
  DOCKER_BUILD_ARGS:
    description: If you want to inject build params to docker build step.
    required: true
  GKE_ZONE:
    description: GKE Zone
    required: true
  GKE_CLUSTER:
    description: Name of the cluster
    required: true
  ARTIFACT_REGISTRY_REGION:
    description: Google Artifact Registry region you want to use
    required: true
  ARTIFACT_REGISTRY_REPO:
    description: Google artifact Registry repository you want to store your build image in
    required: true
  ARTIFACT_REGISTRY_IMAGE:
    description: Google Artifact Registry image
    required: true
  IMAGE_TAG:
    description: Tag for your image
    required: true
  GKE_CONFIG_DIR:
    description: K8S config file directory.
    required: true
  GKE_IMAGE_TEMPLATE:
    description: GKE Deployment Image Template
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
    - name: Auth Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        credentials_json: ${{ inputs.GOOGLE_CLOUD_SERVICE_ACCOUNT_KEY }}
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      with:
        project_id: ${{ inputs.GOOGLE_CLOUD_PROJECT_ID }}
    - name: Setup Docker Auth
      shell: bash
      env:
        REGION: ${{ inputs.ARTIFACT_REGISTRY_REGION }}
      run: gcloud --quiet auth configure-docker "${REGION}-docker.pkg.dev"
    - id: set-image-tag
      name: Setup AR image tag url
      shell: bash
      env:
        REGION: ${{ inputs.ARTIFACT_REGISTRY_REGION }}
        PROJECT: ${{ inputs.GOOGLE_CLOUD_PROJECT_ID }}
        REPO: ${{ inputs.ARTIFACT_REGISTRY_REPO }}
        IMAGE: ${{ inputs.ARTIFACT_REGISTRY_IMAGE }}
        TAG: ${{ inputs.IMAGE_TAG }}
      run: |
        delimiter="$(openssl rand -hex 8)"
        echo "ar_image_tag<<$delimiter" >> "$GITHUB_OUTPUT"
        echo "${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
        echo "$delimiter" >> "$GITHUB_OUTPUT"
    - name: Building the Docker Image
      shell: bash
      env:
        AR_IMAGE_TAG: ${{ steps.set-image-tag.outputs.ar_image_tag }}
        IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
        BUILD_ARGS: ${{ inputs.DOCKER_BUILD_ARGS }}
      # Note: $BUILD_ARGS is intentionally left unquoted here so that multiple build args split properly
      run: docker build --tag "$AR_IMAGE_TAG" --build-arg version="$IMAGE_TAG" $BUILD_ARGS .
    - name: Push the Image to Google Artifact Registry
      shell: bash
      env:
        AR_IMAGE_TAG: ${{ steps.set-image-tag.outputs.ar_image_tag }}
      run: docker push "$AR_IMAGE_TAG"
    - name: Setup GKE Credentials
      uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
      with:
        cluster_name: ${{ inputs.GKE_CLUSTER }}
        location: ${{ inputs.GKE_ZONE }}
    - name: Deploy image from AR to GKE
      shell: bash
      env:
        GKE_DIR: ${{ inputs.GKE_CONFIG_DIR }}
        IMAGE_TEMPLATE: ${{ inputs.GKE_IMAGE_TEMPLATE }}
        AR_IMAGE_TAG: ${{ steps.set-image-tag.outputs.ar_image_tag }}
      run: |-
        cd "$GKE_DIR"
        kustomize edit set image "${IMAGE_TEMPLATE}=${AR_IMAGE_TAG}"
        kubectl apply -k .
