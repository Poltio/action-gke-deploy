name: GKE Deploy via Artifact Registry
description: Deploys containers to GKE via Google Artifact Registry
inputs:
  GOOGLE_CLOUD_PROJECT_ID:
    description: Google Cloud Project ID you want to use.
    required: true
  WORKLOAD_IDENTITY_PROVIDER:
    description: Full resource name of the Workload Identity Provider. The calling job needs id-token write permission.
    required: true
  SERVICE_ACCOUNT:
    description: Email of the service account to deploy as.
    required: true
  DOCKER_BUILD_ARGS:
    description: If you want to inject build params to docker build step.
    required: true
  GKE_ZONE:
    description: GKE Zone
    required: true
  GKE_CLUSTER:
    description: Name of the cluster
    required: true
  ARTIFACT_REGISTRY_REGION:
    description: Google Artifact Registry region you want to use
    required: true
  ARTIFACT_REGISTRY_REPO:
    description: Google artifact Registry repository you want to store your build image in
    required: true
  ARTIFACT_REGISTRY_IMAGE:
    description: Google Artifact Registry image
    required: true
  IMAGE_TAG:
    description: Tag for your image
    required: true
  GKE_CONFIG_DIR:
    description: K8S config file directory.
    required: true
  GKE_IMAGE_TEMPLATE:
    description: GKE Deployment Image Template
    required: true
runs:
  using: composite
  steps:
    - name: Auth Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: ${{ inputs.GOOGLE_CLOUD_PROJECT_ID }}
        workload_identity_provider: ${{ inputs.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ inputs.SERVICE_ACCOUNT }}
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      with:
        project_id: ${{ inputs.GOOGLE_CLOUD_PROJECT_ID }}
    - name: Setup Docker Auth
      shell: bash
      env:
        REGION: ${{ inputs.ARTIFACT_REGISTRY_REGION }}
      run: gcloud --quiet auth configure-docker "${REGION}-docker.pkg.dev"
    - id: set-image-tag
      name: Setup AR image tag url
      shell: bash
      env:
        REGION: ${{ inputs.ARTIFACT_REGISTRY_REGION }}
        PROJECT: ${{ inputs.GOOGLE_CLOUD_PROJECT_ID }}
        REPO: ${{ inputs.ARTIFACT_REGISTRY_REPO }}
        IMAGE: ${{ inputs.ARTIFACT_REGISTRY_IMAGE }}
        TAG: ${{ inputs.IMAGE_TAG }}
      run: |
        delimiter="$(openssl rand -hex 8)"
        echo "ar_image_tag<<$delimiter" >> "$GITHUB_OUTPUT"
        echo "${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
        echo "$delimiter" >> "$GITHUB_OUTPUT"
    - name: Build the Docker Image
      shell: bash
      env:
        AR_IMAGE_TAG: ${{ steps.set-image-tag.outputs.ar_image_tag }}
        IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
        BUILD_ARGS: ${{ inputs.DOCKER_BUILD_ARGS }}
        # GKE runs amd64 and the self-hosted runner is arm64; a --platform in BUILD_ARGS still wins
        DOCKER_DEFAULT_PLATFORM: linux/amd64
      run: |
        # builds on the runner's own Docker daemon, whose layer cache carries over between jobs.
        # --provenance=false keeps the pushed artifact a plain manifest.
        # $BUILD_ARGS is deliberately unquoted so callers can pass multiple flags; set -f stops globbing.
        set -f
        docker build --tag "$AR_IMAGE_TAG" --build-arg version="$IMAGE_TAG" --provenance=false $BUILD_ARGS .
    - name: Scan the image for fixable critical vulnerabilities
      shell: bash
      env:
        AR_IMAGE_TAG: ${{ steps.set-image-tag.outputs.ar_image_tag }}
      run: |
        # Trivy runs from its image, so any runner with Docker works. Pinned by digest: Trivy's
        # own tags were hijacked in March 2026 (GHSA-69fq-xp46-6x23).
        # The trivy-cache volume keeps the vulnerability DB between jobs on a self-hosted runner.
        # --image-src docker scans the local build and never pulls from the registry.
        # A .trivyignore in the caller's checkout is picked up through -w /src.
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v trivy-cache:/root/.cache/trivy \
          -v "$PWD:/src:ro" -w /src \
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
          image --image-src docker --severity CRITICAL --ignore-unfixed --exit-code 1 "$AR_IMAGE_TAG"
    - name: Push the Image to Google Artifact Registry
      shell: bash
      env:
        AR_IMAGE_TAG: ${{ steps.set-image-tag.outputs.ar_image_tag }}
      run: docker push "$AR_IMAGE_TAG"
    - name: Setup GKE Credentials
      uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
      with:
        cluster_name: ${{ inputs.GKE_CLUSTER }}
        location: ${{ inputs.GKE_ZONE }}
    - name: Deploy image from AR to GKE
      shell: bash
      env:
        GKE_DIR: ${{ inputs.GKE_CONFIG_DIR }}
        IMAGE_TEMPLATE: ${{ inputs.GKE_IMAGE_TEMPLATE }}
        AR_IMAGE_TAG: ${{ steps.set-image-tag.outputs.ar_image_tag }}
      run: |-
        cd "$GKE_DIR"
        kustomize edit set image "${IMAGE_TEMPLATE}=${AR_IMAGE_TAG}"
        kubectl apply -k .
